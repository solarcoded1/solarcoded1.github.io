<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="manifest.json">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Daily Sheet — Landscape Mobile View</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        serif: ['Newsreader', 'Georgia', 'serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        paper: '#F4F3EF',
                        paperDark: '#EAE8E1',
                        ink: '#111111',
                        charcoal: '#555555',
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #F4F3EF;
            color: #111111;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.035'/%3E%3C/svg%3E");
            -webkit-font-smoothing: antialiased;
        }

        .eink-checkbox {
            appearance: none;
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            border: 1.5px solid #111111;
            border-radius: 0px;
            background-color: transparent;
            display: inline-grid;
            place-content: center;
            cursor: pointer;
            flex-shrink: 0;
            margin-top: 2px;
        }

        .eink-checkbox:checked {
            background-color: #111111;
            border-color: #111111;
        }

        .eink-checkbox::before {
            content: "";
            width: 12px;
            height: 12px;
            transform: scale(0);
            background-color: #F4F3EF;
            clip-path: polygon(14% 44%, 0 65%, 50% 100%, 100% 16%, 80% 0%, 43% 62%);
        }

        .eink-checkbox:checked::before {
            transform: scale(1);
        }

        .tabular-nums {
            font-variant-numeric: tabular-nums;
        }
    </style>
</head>
<body class="min-h-screen p-3 sm:p-5 selection:bg-ink selection:text-paper flex flex-col justify-between">

    <!-- TOP BAR CONTROLS -->
    <div class="w-full max-w-5xl mx-auto flex justify-end mb-2">
        <button id="open-pomodoro" class="font-mono text-[11px] uppercase tracking-wider border-[1.5px] border-ink bg-paper px-3 py-1 hover:bg-ink hover:text-paper transition-none">
            Start Focus Timer
        </button>
    </div>

    <!-- MAIN LANDSCAPE SPLIT (1/3 Left, 2/3 Right) -->
    <main class="w-full max-w-5xl mx-auto grid grid-cols-1 sm:grid-cols-3 gap-4 items-start flex-1">

        <!-- LEFT COLUMN (1/3): Clock & Expanded Weather -->
        <aside class="sm:col-span-1 space-y-3">

            <!-- TIME & DATE BOX -->
            <section class="border-[1.5px] border-ink bg-paper p-3 text-center">
                <div id="live-clock" class="font-mono text-2xl font-semibold tracking-tight text-ink tabular-nums">
                    00:00:00
                </div>
                <p id="live-date" class="font-serif text-xs text-ink mt-1 pt-1 border-t border-dashed border-[#888888]">
                    Loading date...
                </p>
            </section>

            <!-- WEATHER & 3-DAY FORECAST BOX -->
            <section class="border-[1.5px] border-ink bg-paper p-3">
                <div class="flex items-center justify-between border-b border-ink pb-1.5 mb-2">
                    <span class="font-mono text-[10px] uppercase tracking-[0.14em] text-ink font-semibold">Stevenage, UK</span>
                    <span class="font-mono text-[9px] uppercase tracking-[0.14em] text-charcoal">Live</span>
                </div>

                <div class="flex items-center justify-between gap-2">
                    <div>
                        <span id="weather-temp" class="font-mono text-2xl font-semibold text-ink tabular-nums">--°C</span>
                        <p id="weather-condition" class="font-serif text-xs text-ink mt-0.5">Fetching...</p>
                    </div>
                    <div id="weather-icon" class="text-ink shrink-0">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/></svg>
                    </div>
                </div>

                <div class="mt-2 pt-2 border-t border-dashed border-[#888888] grid grid-cols-3 gap-1 font-mono text-[9px] text-charcoal text-center">
                    <div>
                        <span class="block text-[8px]">WIND</span>
                        <span id="weather-wind" class="text-ink font-medium tabular-nums">--</span>
                    </div>
                    <div class="border-x border-dashed border-[#888888]">
                        <span class="block text-[8px]">PRECIP</span>
                        <span id="weather-precip" class="text-ink font-medium tabular-nums">--</span>
                    </div>
                    <div>
                        <span class="block text-[8px]">HUMID</span>
                        <span id="weather-humidity" class="text-ink font-medium tabular-nums">--</span>
                    </div>
                </div>

                <!-- 3-Day Forecast Expansion -->
                <div class="mt-2.5 pt-2 border-t border-ink font-serif text-xs space-y-1">
                    <div class="text-[10px] font-mono uppercase tracking-wider text-charcoal mb-1">3-Day Outlook</div>
                    <div id="forecast-container" class="space-y-1 text-ink">
                        <div class="flex justify-between"><span>Loading...</span><span>--° / --°</span></div>
                    </div>
                </div>
            </section>

        </aside>

        <!-- RIGHT COLUMN (2/3): To-Do Display -->
        <section class="sm:col-span-2 border-[1.5px] border-ink bg-paper p-4">
            <header class="border-b-[1.5px] border-ink pb-2 mb-3 flex items-baseline justify-between">
                <h1 class="font-serif text-xl font-medium tracking-tight text-ink">
                    To-Do Display
                </h1>
                <span id="task-count" class="font-mono text-xs uppercase tracking-[0.12em] text-charcoal">
                    0 items
                </span>
            </header>

            <ul id="todo-list" class="divide-y divide-dashed divide-[#888888] border-t border-b border-ink max-h-[55vh] overflow-y-auto pr-1">
                <!-- Dynamically rendered from Firebase -->
            </ul>

            <p id="empty-state" class="hidden py-6 text-center font-serif italic text-sm text-charcoal border-t border-b border-ink">
                No active tasks. Add items from your PC control panel.
            </p>
        </section>

    </main>

    <!-- FULLSCREEN POMODORO BLOCKER MODAL -->
    <div id="pomodoro-modal" class="fixed inset-0 bg-[#F4F3EF] z-50 p-6 flex flex-col hidden">
        <div class="flex justify-between items-center border-b-[1.5px] border-ink pb-3 mb-6">
            <span class="font-mono text-xs uppercase tracking-widest text-ink font-semibold">Fullscreen Focus Mode</span>
            <button id="close-pomodoro" class="font-mono text-xs uppercase tracking-wider border-[1.5px] border-ink px-3 py-1 hover:bg-ink hover:text-paper">Exit Blocker</button>
        </div>

        <div class="flex-1 grid grid-cols-1 sm:grid-cols-2 gap-6 items-center max-w-4xl mx-auto w-full">
            <!-- Left Side: Timer -->
            <div class="border-[1.5px] border-ink p-8 text-center bg-paperDark/20">
                <span class="font-mono text-xs uppercase tracking-widest text-charcoal block mb-2">Pomodoro Session</span>
                <div id="pomo-timer" class="font-mono text-6xl sm:text-7xl font-semibold tracking-tighter text-ink tabular-nums my-4">
                    25:00
                </div>
                <div class="flex justify-center gap-3 mt-4">
                    <button id="pomo-toggle" class="font-mono text-xs uppercase tracking-wider border-[1.5px] border-ink px-5 py-2 hover:bg-ink hover:text-paper">Start</button>
                    <button id="pomo-reset" class="font-mono text-xs uppercase tracking-wider border-[1.5px] border-ink px-5 py-2 hover:bg-ink hover:text-paper">Reset</button>
                </div>
            </div>

            <!-- Right Side: Todos Inside Blocker -->
            <div class="border-[1.5px] border-ink p-6 bg-paper h-full max-h-[60vh] flex flex-col">
                <h3 class="font-serif text-lg font-medium border-b border-ink pb-2 mb-3">Active Focus Tasks</h3>
                <ul id="pomo-todo-list" class="divide-y divide-dashed divide-[#888888] overflow-y-auto flex-1 pr-1">
                    <!-- Synced tasks -->
                </ul>
            </div>
        </div>
    </div>

    <!-- SCRIPTS -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

        const firebaseConfig = {
            databaseURL: "https://website-f5c09-default-rtdb.europe-west1.firebasedatabase.app/"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const todosRef = ref(db, 'todos');

        let todos = [];

        // 1. Live Clock & Date
        const clockEl = document.getElementById('live-clock');
        const dateEl = document.getElementById('live-date');

        function updateClockAndDate() {
            const now = new Date();
            clockEl.textContent = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}:${String(now.getSeconds()).padStart(2, '0')}`;
            dateEl.textContent = `${now.toLocaleDateString('en-GB', { weekday: 'short' })}, ${now.getDate()} ${now.toLocaleDateString('en-GB', { month: 'short' })} ${now.getFullYear()}`;
        }
        updateClockAndDate();
        setInterval(updateClockAndDate, 1000);

        // 2. Weather & 3-Day Forecast (Stevenage)
        const tempEl = document.getElementById('weather-temp');
        const conditionEl = document.getElementById('weather-condition');
        const windEl = document.getElementById('weather-wind');
        const precipEl = document.getElementById('weather-precip');
        const humidityEl = document.getElementById('weather-humidity');
        const iconEl = document.getElementById('weather-icon');
        const forecastContainer = document.getElementById('forecast-container');

        async function fetchWeather() {
            try {
                const res = await fetch('https://api.open-meteo.com/v1/forecast?latitude=51.9022&longitude=-0.2026&current=temperature_2m,relative_humidity_2m,precipitation,weather_code,wind_speed_10m&daily=weather_code,temperature_2m_max,temperature_2m_min&wind_speed_unit=kmh&timezone=Europe/London');
                const data = await res.json();
                if (data && data.current) {
                    tempEl.textContent = `${Math.round(data.current.temperature_2m)}°C`;
                    windEl.textContent = `${Math.round(data.current.wind_speed_10m)} km/h`;
                    precipEl.textContent = `${data.current.precipitation}mm`;
                    humidityEl.textContent = `${data.current.relative_humidity_2m}%`;

                    let code = data.current.weather_code;
                    conditionEl.textContent = code === 0 ? 'Clear Sky' : code <= 2 ? 'Partly Cloudy' : code >= 51 ? 'Rain' : 'Overcast';
                }
                if (data && data.daily) {
                    forecastContainer.innerHTML = '';
                    for (let i = 1; i <= 3; i++) {
                        const dateObj = new Date(data.daily.time[i]);
                        const dayName = dateObj.toLocaleDateString('en-GB', { weekday: 'short' });
                        const maxT = Math.round(data.daily.temperature_2m_max[i]);
                        const minT = Math.round(data.daily.temperature_2m_min[i]);
                        
                        const row = document.createElement('div');
                        row.className = 'flex justify-between items-center text-[11px]';
                        row.innerHTML = `<span class="font-mono text-charcoal">${dayName}</span><span class="tabular-nums">${minT}°C / ${maxT}°C</span>`;
                        forecastContainer.appendChild(row);
                    }
                }
            } catch (e) {
                conditionEl.textContent = 'Unavailable';
            }
        }
        fetchWeather();
        setInterval(fetchWeather, 15 * 60 * 1000);

        // 3. To-Do Sync & Rendering
        const todoList = document.getElementById('todo-list');
        const pomoTodoList = document.getElementById('pomo-todo-list');
        const emptyState = document.getElementById('empty-state');
        const taskCountEl = document.getElementById('task-count');

        function renderTodos() {
            const htmlContent = todos.length === 0 ? '' : todos.map((todo, index) => {
                let subtasksHTML = '';
                if (todo.subtasks && todo.subtasks.length > 0) {
                    subtasksHTML = '<ul class="ml-6 mt-1 space-y-1 border-l border-dashed border-[#888888] pl-2">';
                    todo.subtasks.forEach((sub, subIdx) => {
                        subtasksHTML += `
                            <li class="flex items-center gap-2" data-index="${index}" data-sub-index="${subIdx}">
                                <input type="checkbox" class="eink-checkbox toggle-subtask" ${sub.completed ? 'checked' : ''}>
                                <span class="font-serif text-xs ${sub.completed ? 'line-through text-[#666666]' : 'text-ink'}">${sub.text}</span>
                            </li>`;
                    });
                    subtasksHTML += '</ul>';
                }

                return `
                    <li class="py-2" data-index="${index}">
                        <div class="flex items-start gap-2.5">
                            <input type="checkbox" class="eink-checkbox toggle-todo" ${todo.completed ? 'checked' : ''}>
                            <span class="font-serif text-sm leading-snug break-words ${todo.completed ? 'line-through text-[#666666]' : 'text-ink'}">${todo.text}</span>
                        </div>
                        ${subtasksHTML}
                    </li>`;
            }).join('');

            todoList.innerHTML = htmlContent;
            pomoTodoList.innerHTML = htmlContent;
            taskCountEl.textContent = `${todos.length} items`;

            if (todos.length === 0) {
                todoList.classList.add('hidden');
                emptyState.classList.remove('hidden');
            } else {
                todoList.classList.remove('hidden');
                emptyState.classList.add('hidden');
            }
        }

        onValue(todosRef, (snapshot) => {
            todos = snapshot.val() || [];
            renderTodos();
        });

        // Handle checkbox updates / auto-delete
        function handleCheck(e) {
            const li = e.target.closest('li[data-index]');
            if (!li) return;
            const index = parseInt(li.dataset.index);

            if (e.target.classList.contains('toggle-todo')) {
                setTimeout(() => {
                    todos.splice(index, 1);
                    set(todosRef, todos);
                }, 300);
            } else if (e.target.classList.contains('toggle-subtask')) {
                const subIndex = parseInt(li.dataset.subIndex);
                setTimeout(() => {
                    if (todos[index] && todos[index].subtasks) {
                        todos[index].subtasks.splice(subIndex, 1);
                        set(todosRef, todos);
                    }
                }, 300);
            }
        }

        todoList.addEventListener('change', handleCheck);
        pomoTodoList.addEventListener('change', handleCheck);

        // 4. Pomodoro Blocker Logic
        const modal = document.getElementById('pomodoro-modal');
        document.getElementById('open-pomodoro').addEventListener('click', () => modal.classList.remove('hidden'));
        document.getElementById('close-pomodoro').addEventListener('click', () => modal.classList.add('hidden'));

        let pomoTime = 25 * 60;
        let pomoInterval = null;
        let isRunning = false;
        const timerDisplay = document.getElementById('pomo-timer');
        const toggleBtn = document.getElementById('pomo-toggle');

        function updateTimerDisplay() {
            const mins = Math.floor(pomoTime / 60);
            const secs = pomoTime % 60;
            timerDisplay.textContent = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
        }

        toggleBtn.addEventListener('click', () => {
            if (isRunning) {
                clearInterval(pomoInterval);
                isRunning = false;
                toggleBtn.textContent = 'Start';
            } else {
                isRunning = true;
                toggleBtn.textContent = 'Pause';
                pomoInterval = setInterval(() => {
                    if (pomoTime > 0) {
                        pomoTime--;
                        updateTimerDisplay();
                    } else {
                        clearInterval(pomoInterval);
                        alert('Pomodoro session completed!');
                        isRunning = false;
                        toggleBtn.textContent = 'Start';
                    }
                }, 1000);
            }
        });

        document.getElementById('pomo-reset').addEventListener('click', () => {
            clearInterval(pomoInterval);
            isRunning = false;
            pomoTime = 25 * 60;
            updateTimerDisplay();
            toggleBtn.textContent = 'Start';
        });
    </script>
</body>
</html>
