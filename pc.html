<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="manifest.json">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Daily Sheet — PC Control Panel</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        serif: ['Newsreader', 'Georgia', 'serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        paper: '#F4F3EF',
                        paperDark: '#EAE8E1',
                        ink: '#111111',
                        charcoal: '#555555',
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #F4F3EF;
            color: #111111;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.035'/%3E%3C/svg%3E");
            -webkit-font-smoothing: antialiased;
        }

        .eink-input {
            background: transparent;
            border: 1.5px solid #111111;
            padding: 10px 14px;
            font-family: 'Newsreader', serif;
            font-size: 1.1rem;
            color: #111111;
            outline: none;
        }

        .eink-input:focus {
            background-color: #EAE8E1;
        }

        .eink-btn {
            border: 1.5px solid #111111;
            background: transparent;
            color: #111111;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.14em;
            padding: 10px 20px;
            cursor: pointer;
        }

        .eink-btn:hover {
            background: #111111;
            color: #F4F3EF;
        }
    </style>
</head>
<body class="min-h-screen p-6 sm:p-10 selection:bg-ink selection:text-paper">

    <main class="max-w-2xl mx-auto space-y-6">

        <!-- HEADER -->
        <header class="border-[1.5px] border-ink bg-paper p-6 text-center relative">
            <div class="absolute left-6 top-6">
                <a href="phone.html" class="font-mono text-[11px] uppercase tracking-wider border-[1.5px] border-ink px-3 py-1 hover:bg-ink hover:text-paper transition-none">&larr; Phone View</a>
            </div>
            <span class="font-mono text-[11px] uppercase tracking-[0.16em] text-charcoal block mb-1">
                Command Center
            </span>
            <h1 class="font-serif text-3xl sm:text-4xl font-medium tracking-tight text-ink">
                PC Control Panel
            </h1>
        </header>

        <!-- ADD TASK FORM -->
        <section class="border-[1.5px] border-ink bg-paper p-6">
            <h2 class="font-serif text-xl font-medium mb-4 text-ink">Add New Task & Sub-tasks</h2>
            <form id="add-task-form" class="space-y-4">
                <div>
                    <label for="task-input" class="block font-mono text-xs uppercase tracking-[0.12em] text-charcoal mb-1">Main Task</label>
                    <input type="text" id="task-input" placeholder="Enter main task..." required class="w-full eink-input" autocomplete="off">
                </div>
                <div>
                    <label for="subtask-input" class="block font-mono text-xs uppercase tracking-[0.12em] text-charcoal mb-1">Sub-tasks (comma separated, optional)</label>
                    <input type="text" id="subtask-input" placeholder="e.g. Check email, Call office" class="w-full eink-input" autocomplete="off">
                </div>
                <button type="submit" class="eink-btn w-full">Add to Daily Sheet</button>
            </form>
        </section>

        <!-- CURRENT TASKS MANAGEMENT -->
        <section class="border-[1.5px] border-ink bg-paper p-6">
            <header class="border-b-[1.5px] border-ink pb-3 mb-4 flex items-baseline justify-between">
                <h2 class="font-serif text-2xl font-medium text-ink">Manage Active Tasks</h2>
                <span id="task-count" class="font-mono text-xs uppercase tracking-[0.12em] text-charcoal">0 items</span>
            </header>

            <ul id="pc-todo-list" class="space-y-4">
                <!-- Populated dynamically -->
            </ul>

            <p id="empty-state" class="hidden py-8 text-center font-serif italic text-base text-charcoal border-t border-b border-ink">
                No active tasks recorded. Use the form above to add some.
            </p>
        </section>

    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

        const firebaseConfig = {
            databaseURL: "https://website-f5c09-default-rtdb.europe-west1.firebasedatabase.app/"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const todosRef = ref(db, 'todos');

        let todos = [];

        const taskForm = document.getElementById('add-task-form');
        const taskInput = document.getElementById('task-input');
        const subtaskInput = document.getElementById('subtask-input');
        const pcTodoList = document.getElementById('pc-todo-list');
        const emptyState = document.getElementById('empty-state');
        const taskCountEl = document.getElementById('task-count');

        // Listen for live database updates
        onValue(todosRef, (snapshot) => {
            const data = snapshot.val();
            todos = data ? data : [];
            renderPCList();
        });

        function renderPCList() {
            pcTodoList.innerHTML = '';
            taskCountEl.textContent = `${todos.length} items`;

            if (todos.length === 0) {
                pcTodoList.classList.add('hidden');
                emptyState.classList.remove('hidden');
                return;
            }

            pcTodoList.classList.remove('hidden');
            emptyState.classList.add('hidden');

            todos.forEach((todo, index) => {
                const li = document.createElement('li');
                li.className = 'border-[1.5px] border-ink p-4 bg-paperDark/20 flex flex-col gap-2';

                let subtasksHTML = '';
                if (todo.subtasks && todo.subtasks.length > 0) {
                    subtasksHTML = '<ul class="ml-4 space-y-1 border-l border-dashed border-[#888888] pl-3 mt-1">';
                    todo.subtasks.forEach(sub => {
                        subtasksHTML += `<li class="font-serif text-sm text-charcoal">• ${sub.text}</li>`;
                    });
                    subtasksHTML += '</ul>';
                }

                li.innerHTML = `
                    <div class="flex items-center justify-between">
                        <span class="font-serif text-lg font-medium text-ink">${todo.text}</span>
                        <button data-index="${index}" class="delete-btn font-mono text-[10px] uppercase tracking-wider border border-ink px-2.5 py-1 hover:bg-ink hover:text-paper">Delete</button>
                    </div>
                    ${subtasksHTML}
                `;
                pcTodoList.appendChild(li);
            });
        }

        // Add task event
        taskForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const text = taskInput.value.trim();
            if (!text) return;

            const rawSubtasks = subtaskInput.value.trim();
            let subtasks = [];
            if (rawSubtasks) {
                subtasks = rawSubtasks.split(',').map(s => ({
                    text: s.trim(),
                    completed: false
                })).filter(s => s.text.length > 0);
            }

            todos.push({
                text: text,
                completed: false,
                subtasks: subtasks
            });

            set(todosRef, todos);

            taskInput.value = '';
            subtaskInput.value = '';
        });

        // Delete task event
        pcTodoList.addEventListener('click', (e) => {
            if (e.target.classList.contains('delete-btn')) {
                const index = parseInt(e.target.dataset.index);
                todos.splice(index, 1);
                set(todosRef, todos);
            }
        });
    </script>
</body>
</html>
