<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="manifest.json">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Daily Sheet — PC Control Panel</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        serif: ['Newsreader', 'Georgia', 'serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        paper: '#F4F3EF',
                        paperDark: '#EAE8E1',
                        ink: '#111111',
                        charcoal: '#555555',
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #F4F3EF;
            color: #111111;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.035'/%3E%3C/svg%3E");
            -webkit-font-smoothing: antialiased;
        }

        .eink-input {
            background: transparent;
            border: 1.5px solid #111111;
            padding: 8px 12px;
            font-family: 'Newsreader', serif;
            font-size: 1rem;
            color: #111111;
            outline: none;
        }

        .eink-input:focus {
            background-color: #EAE8E1;
        }

        .eink-btn {
            border: 1.5px solid #111111;
            background: transparent;
            color: #111111;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.14em;
            padding: 9px 16px;
            cursor: pointer;
        }

        .eink-btn:hover {
            background: #111111;
            color: #F4F3EF;
        }

        .tabular-nums {
            font-variant-numeric: tabular-nums;
        }
    </style>
</head>
<body class="min-h-screen p-4 sm:p-6 selection:bg-ink selection:text-paper flex flex-col justify-between">

    <!-- TOP HEADER / COMMAND CENTER -->
    <header class="w-full max-w-6xl mx-auto border-[1.5px] border-ink bg-paper p-4 mb-4 flex items-center justify-between">
        <div>
            <span class="font-mono text-[10px] uppercase tracking-[0.16em] text-charcoal block">E-Paper Workspace</span>
            <h1 class="font-serif text-2xl font-medium tracking-tight text-ink">PC Control Panel</h1>
        </div>
        <button id="open-pomodoro" class="eink-btn">
            Start Focus Timer
        </button>
    </header>

    <!-- MAIN LANDSCAPE SPLIT GRID (Left Column: Add Form & Timer Control, Right Column: Active Tasks) -->
    <main class="w-full max-w-6xl mx-auto grid grid-cols-1 md:grid-cols-3 gap-4 items-start flex-1">

        <!-- LEFT COLUMN (1/3): Add Task Form & Quick Widget Stats -->
        <aside class="md:col-span-1 space-y-4">
            <!-- ADD TASK SECTION -->
            <section class="border-[1.5px] border-ink bg-paper p-4">
                <h2 class="font-serif text-lg font-medium mb-3 text-ink border-b border-ink pb-2">Add New Task</h2>
                <form id="add-task-form" class="space-y-3">
                    <div>
                        <label for="task-input" class="block font-mono text-[10px] uppercase tracking-[0.12em] text-charcoal mb-1">Main Task</label>
                        <input type="text" id="task-input" placeholder="Enter main task..." required class="w-full eink-input" autocomplete="off">
                    </div>
                    <div>
                        <label for="subtask-input" class="block font-mono text-[10px] uppercase tracking-[0.12em] text-charcoal mb-1">Sub-tasks (comma separated)</label>
                        <input type="text" id="subtask-input" placeholder="e.g. Email office, Review notes" class="w-full eink-input" autocomplete="off">
                    </div>
                    <button type="submit" class="eink-btn w-full mt-1">Add to Daily Sheet</button>
                </form>
            </section>
        </aside>

        <!-- RIGHT COLUMN (2/3): Task Management List -->
        <section class="md:col-span-2 border-[1.5px] border-ink bg-paper p-4">
            <header class="border-b-[1.5px] border-ink pb-2 mb-3 flex items-baseline justify-between">
                <h2 class="font-serif text-xl font-medium text-ink">Manage Active Tasks</h2>
                <span id="task-count" class="font-mono text-xs uppercase tracking-[0.12em] text-charcoal">0 items</span>
            </header>

            <ul id="pc-todo-list" class="space-y-3 max-h-[60vh] overflow-y-auto pr-1">
                <!-- Populated dynamically -->
            </ul>

            <p id="empty-state" class="hidden py-8 text-center font-serif italic text-sm text-charcoal border-t border-b border-ink">
                No active tasks recorded. Use the form on the left to add items.
            </p>
        </section>

    </main>

    <!-- FULLSCREEN POMODORO BLOCKER MODAL -->
    <div id="pomodoro-modal" class="fixed inset-0 bg-[#F4F3EF] z-50 p-6 flex flex-col hidden">
        <div class="flex justify-between items-center border-b-[1.5px] border-ink pb-3 mb-6">
            <span class="font-mono text-xs uppercase tracking-widest text-ink font-semibold">PC Focus Mode</span>
            <button id="close-pomodoro" class="eink-btn">Exit Blocker</button>
        </div>

        <div class="flex-1 grid grid-cols-1 sm:grid-cols-2 gap-6 items-center max-w-4xl mx-auto w-full">
            <!-- Left Side: Timer -->
            <div class="border-[1.5px] border-ink p-8 text-center bg-paperDark/20">
                <span class="font-mono text-xs uppercase tracking-widest text-charcoal block mb-2">Pomodoro Session</span>
                <div id="pomo-timer" class="font-mono text-6xl sm:text-7xl font-semibold tracking-tighter text-ink tabular-nums my-4">
                    25:00
                </div>
                <div class="flex justify-center gap-3 mt-4">
                    <button id="pomo-toggle" class="eink-btn px-5">Start</button>
                    <button id="pomo-reset" class="eink-btn px-5">Reset</button>
                </div>
            </div>

            <!-- Right Side: Todos Inside Blocker -->
            <div class="border-[1.5px] border-ink p-6 bg-paper h-full max-h-[60vh] flex flex-col">
                <h3 class="font-serif text-lg font-medium border-b border-ink pb-2 mb-3">Active Focus Tasks</h3>
                <ul id="pomo-todo-list" class="divide-y divide-dashed divide-[#888888] overflow-y-auto flex-1 pr-1">
                    <!-- Synced tasks -->
                </ul>
            </div>
        </div>
    </div>

    <!-- SCRIPTS -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

        const firebaseConfig = {
            databaseURL: "https://website-f5c09-default-rtdb.europe-west1.firebasedatabase.app/"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const todosRef = ref(db, 'todos');

        let todos = [];

        const taskForm = document.getElementById('add-task-form');
        const taskInput = document.getElementById('task-input');
        const subtaskInput = document.getElementById('subtask-input');
        const pcTodoList = document.getElementById('pc-todo-list');
        const pomoTodoList = document.getElementById('pomo-todo-list');
        const emptyState = document.getElementById('empty-state');
        const taskCountEl = document.getElementById('task-count');

        // Listen for live database updates
        onValue(todosRef, (snapshot) => {
            const data = snapshot.val();
            todos = data ? data : [];
            renderPCList();
        });

        function renderPCList() {
            taskCountEl.textContent = `${todos.length} items`;

            if (todos.length === 0) {
                pcTodoList.classList.add('hidden');
                pomoTodoList.innerHTML = '';
                emptyState.classList.remove('hidden');
                return;
            }

            pcTodoList.classList.remove('hidden');
            emptyState.classList.add('hidden');

            const pcHTML = todos.map((todo, index) => {
                let subtasksHTML = '';
                if (todo.subtasks && todo.subtasks.length > 0) {
                    subtasksHTML = '<ul class="ml-4 space-y-1 border-l border-dashed border-[#888888] pl-3 mt-1.5">';
                    todo.subtasks.forEach(sub => {
                        subtasksHTML += `<li class="font-serif text-sm text-charcoal">• ${sub.text}</li>`;
                    });
                    subtasksHTML += '</ul>';
                }

                return `
                    <li class="border-[1.5px] border-ink p-3.5 bg-paperDark/20 flex flex-col gap-2" data-index="${index}">
                        <div class="flex items-center justify-between">
                            <span class="font-serif text-base font-medium text-ink">${todo.text}</span>
                            <button data-index="${index}" class="delete-btn font-mono text-[10px] uppercase tracking-wider border border-ink px-2.5 py-1 hover:bg-ink hover:text-paper">Delete</button>
                        </div>
                        ${subtasksHTML}
                    </li>`;
            }).join('');

            const pomoHTML = todos.map((todo) => {
                let subtasksHTML = '';
                if (todo.subtasks && todo.subtasks.length > 0) {
                    subtasksHTML = '<ul class="ml-5 mt-1 space-y-1 border-l border-dashed border-[#888888] pl-2">';
                    todo.subtasks.forEach(sub => {
                        subtasksHTML += `<li class="font-serif text-xs text-charcoal">• ${sub.text}</li>`;
                    });
                    subtasksHTML += '</ul>';
                }
                return `
                    <li class="py-2">
                        <span class="font-serif text-sm font-medium text-ink">${todo.text}</span>
                        ${subtasksHTML}
                    </li>`;
            }).join('');

            pcTodoList.innerHTML = pcHTML;
            pomoTodoList.innerHTML = pomoHTML;
        }

        // Add task event
        taskForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const text = taskInput.value.trim();
            if (!text) return;

            const rawSubtasks = subtaskInput.value.trim();
            let subtasks = [];
            if (rawSubtasks) {
                subtasks = rawSubtasks.split(',').map(s => ({
                    text: s.trim(),
                    completed: false
                })).filter(s => s.text.length > 0);
            }

            todos.push({
                text: text,
                completed: false,
                subtasks: subtasks
            });

            set(todosRef, todos);

            taskInput.value = '';
            subtaskInput.value = '';
        });

        // Delete task event
        pcTodoList.addEventListener('click', (e) => {
            if (e.target.classList.contains('delete-btn')) {
                const index = parseInt(e.target.dataset.index);
                todos.splice(index, 1);
                set(todosRef, todos);
            }
        });

        // Pomodoro Blocker Logic for PC
        const modal = document.getElementById('pomodoro-modal');
        document.getElementById('open-pomodoro').addEventListener('click', () => modal.classList.remove('hidden'));
        document.getElementById('close-pomodoro').addEventListener('click', () => modal.classList.add('hidden'));

        let pomoTime = 25 * 60;
        let pomoInterval = null;
        let isRunning = false;
        const timerDisplay = document.getElementById('pomo-timer');
        const toggleBtn = document.getElementById('pomo-toggle');

        function updateTimerDisplay() {
            const mins = Math.floor(pomoTime / 60);
            const secs = pomoTime % 60;
            timerDisplay.textContent = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
        }

        toggleBtn.addEventListener('click', () => {
            if (isRunning) {
                clearInterval(pomoInterval);
                isRunning = false;
                toggleBtn.textContent = 'Start';
            } else {
                isRunning = true;
                toggleBtn.textContent = 'Pause';
                pomoInterval = setInterval(() => {
                    if (pomoTime > 0) {
                        pomoTime--;
                        updateTimerDisplay();
                    } else {
                        clearInterval(pomoInterval);
                        alert('Pomodoro session completed!');
                        isRunning = false;
                        toggleBtn.textContent = 'Start';
                    }
                }, 1000);
            }
        });

        document.getElementById('pomo-reset').addEventListener('click', () => {
            clearInterval(pomoInterval);
            isRunning = false;
            pomoTime = 25 * 60;
            updateTimerDisplay();
            toggleBtn.textContent = 'Start';
        });
    </script>
</body>
</html>
