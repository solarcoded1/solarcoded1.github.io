<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Sheet — PC Control</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Editorial Serif & Crisp Monospace Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&display=swap" rel="stylesheet">

    <script>

                import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
        
        const firebaseConfig = {
            databaseURL: "https://website-f5c09-default-rtdb.europe-west1.firebasedatabase.app/"
        };
        
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const todosRef = ref(db, 'todos');
        
        // Whenever you modify todos on PC, save to Firebase:
        function saveTodos() {
            set(todosRef, todos);
        }
        
        // Listen for live updates from database:
        onValue(todosRef, (snapshot) => {
            const data = snapshot.val();
            todos = data ? data : [];
            renderTodos();
        });


        
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        serif: ['Newsreader', 'Georgia', 'serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        paper: '#F4F3EF',
                        paperDark: '#EAE8E1',
                        ink: '#111111',
                        charcoal: '#555555',
                    }
                }
            }
        }

        
    </script>

    <style>
        body {
            background-color: #F4F3EF;
            color: #111111;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.035'/%3E%3C/svg%3E");
            -webkit-font-smoothing: antialiased;
        }

        .eink-checkbox {
            appearance: none;
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            border: 1.5px solid #111111;
            border-radius: 0px;
            background-color: transparent;
            display: inline-grid;
            place-content: center;
            cursor: pointer;
            flex-shrink: 0;
            margin-top: 3px;
        }

        .eink-checkbox:checked {
            background-color: #111111;
            border-color: #111111;
        }

        .eink-checkbox::before {
            content: "";
            width: 11px;
            height: 11px;
            transform: scale(0);
            background-color: #F4F3EF;
            clip-path: polygon(14% 44%, 0 65%, 50% 100%, 100% 16%, 80% 0%, 43% 62%);
        }

        .eink-checkbox:checked::before {
            transform: scale(1);
        }

        input:focus-visible,
        button:focus-visible {
            outline: 1.5px solid #111111;
            outline-offset: 2px;
        }

        .tabular-nums {
            font-variant-numeric: tabular-nums;
        }
    </style>
</head>
<body class="min-h-screen p-6 md:p-12 selection:bg-ink selection:text-paper">

    <main class="max-w-4xl mx-auto grid grid-cols-1 md:grid-cols-3 gap-8 items-start">

        <!-- LEFT COLUMN (1/3): Status & Controls -->
        <aside class="md:col-span-1 space-y-6">
            
            <section class="border-[1.5px] border-ink bg-paper p-5">
                <div class="flex items-center justify-between border-b border-ink pb-2 mb-3">
                    <span class="font-mono text-[11px] uppercase tracking-[0.14em] text-ink font-semibold">PC Control</span>
                    <span class="font-mono text-[11px] uppercase tracking-[0.14em] text-charcoal">Admin</span>
                </div>
                <div id="live-clock" class="font-mono text-2xl font-semibold text-ink tabular-nums">
                    00:00:00
                </div>
                <p id="live-date" class="font-serif text-sm text-charcoal mt-1">
                    Loading date...
                </p>
            </section>

            <!-- Sheet Actions -->
            <section class="border-[1.5px] border-ink bg-paper p-5 space-y-3">
                <div class="border-b border-ink pb-2 mb-3">
                    <span class="font-mono text-[11px] uppercase tracking-[0.14em] text-ink font-semibold">Sheet Actions</span>
                </div>
                <button 
                    id="clear-all-btn" 
                    type="button" 
                    class="w-full border-[1.5px] border-ink bg-transparent text-ink hover:bg-ink hover:text-paper font-mono text-xs uppercase tracking-[0.12em] py-2.5 px-4 cursor-pointer text-left flex justify-between items-center"
                >
                    <span>Clear Entire Sheet</span>
                    <span>&times;</span>
                </button>
                <p class="font-serif text-xs text-charcoal italic pt-1">
                    Changes save automatically to local storage. To sync across devices over Wi-Fi or the web, connect a shared database URL.
                </p>
            </section>

        </aside>

        <!-- RIGHT COLUMN (2/3): Main Task & Sub-Task Editor -->
        <section class="md:col-span-2 border-[1.5px] border-ink bg-paper p-6 sm:p-8">
            
            <header class="border-b-[1.5px] border-ink pb-3 mb-6 flex items-baseline justify-between">
                <h1 class="font-serif text-3xl font-medium tracking-tight text-ink">
                    Manage Tasks
                </h1>
                <span id="task-count" class="font-mono text-xs uppercase tracking-[0.12em] text-charcoal">
                    0 active
                </span>
            </header>

            <!-- Add Main Task Form -->
            <form id="todo-form" class="flex flex-col sm:flex-row gap-3 mb-6">
                <label for="todo-input" class="sr-only">New main task</label>
                <input 
                    type="text" 
                    id="todo-input" 
                    placeholder="Enter a new main task..." 
                    autocomplete="off"
                    class="flex-1 bg-transparent border-[1.5px] border-ink px-3.5 py-2.5 font-serif text-base text-ink placeholder-[#777777] focus:bg-paperDark/50 focus:outline-none"
                >
                <button 
                    type="submit" 
                    class="border-[1.5px] border-ink bg-ink text-paper hover:bg-transparent hover:text-ink font-mono text-xs uppercase tracking-[0.14em] px-6 py-3 cursor-pointer"
                >
                    Add Task
                </button>
            </form>

            <!-- Editable Task List -->
            <ul id="todo-list" class="divide-y divide-dashed divide-[#888888] border-t border-b border-ink">
                <!-- Tasks & Subtasks rendered dynamically -->
            </ul>

            <p id="empty-state" class="hidden py-10 text-center font-serif italic text-base text-charcoal border-t border-b border-ink">
                Your sheet is currently clear. Add a task above.
            </p>

        </section>

    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // 1. Clock & Date
            const clockEl = document.getElementById('live-clock');
            const dateEl = document.getElementById('live-date');

            function updateClock() {
                const now = new Date();
                clockEl.textContent = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}:${String(now.getSeconds()).padStart(2, '0')}`;
                dateEl.textContent = `${now.toLocaleDateString('en-GB', { weekday: 'long' })}, ${now.getDate()} ${now.toLocaleDateString('en-GB', { month: 'short' })} ${now.getFullYear()}`;
            }
            updateClock();
            setInterval(updateClock, 1000);

            // 2. Shared Storage Key (Matches phone.html)
            const STORAGE_KEY = 'epaper_todos_v1';
            const todoForm = document.getElementById('todo-form');
            const todoInput = document.getElementById('todo-input');
            const todoList = document.getElementById('todo-list');
            const emptyState = document.getElementById('empty-state');
            const taskCountEl = document.getElementById('task-count');
            const clearAllBtn = document.getElementById('clear-all-btn');

            let todos = [];

            function loadTodos() {
                try {
                    const saved = localStorage.getItem(STORAGE_KEY);
                    todos = saved ? JSON.parse(saved) : [];
                } catch (e) {
                    todos = [];
                }
            }

            function saveTodos() {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
            }

            function escapeHTML(str) {
                const div = document.createElement('div');
                div.textContent = str;
                return div.innerHTML;
            }

            function renderTodos() {
                todoList.innerHTML = '';
                taskCountEl.textContent = `${todos.length} ${todos.length === 1 ? 'task' : 'tasks'}`;

                if (todos.length === 0) {
                    todoList.classList.add('hidden');
                    emptyState.classList.remove('hidden');
                    return;
                }

                todoList.classList.remove('hidden');
                emptyState.classList.add('hidden');

                todos.forEach(todo => {
                    const li = document.createElement('li');
                    li.className = 'py-4';
                    li.dataset.id = todo.id;

                    // Subtasks list HTML
                    let subtasksHTML = '<ul class="ml-7 mt-2.5 space-y-2 border-l border-dashed border-[#888888] pl-3">';
                    if (todo.subtasks && todo.subtasks.length > 0) {
                        todo.subtasks.forEach(sub => {
                            subtasksHTML += `
                                <li class="flex items-center justify-between gap-2 text-sm" data-sub-id="${sub.id}">
                                    <span class="font-serif text-ink">${escapeHTML(sub.text)}</span>
                                    <button type="button" class="remove-sub-btn font-mono text-[10px] uppercase tracking-wider text-charcoal hover:text-ink underline cursor-pointer">
                                        Remove
                                    </button>
                                </li>
                            `;
                        });
                    }
                    // Inline Add Subtask Form
                    subtasksHTML += `
                        <li class="pt-1">
                            <form class="subtask-form flex gap-2">
                                <input 
                                    type="text" 
                                    placeholder="+ Add sub-task..." 
                                    class="subtask-input flex-1 bg-transparent border-b border-[#888888] focus:border-ink py-1 font-serif text-sm text-ink placeholder-[#777777] focus:outline-none"
                                >
                                <button type="submit" class="font-mono text-[10px] uppercase tracking-wider border border-ink px-2.5 py-1 hover:bg-ink hover:text-paper cursor-pointer">
                                    Add
                                </button>
                            </form>
                        </li>
                    </ul>`;

                    li.innerHTML = `
                        <div class="flex items-start justify-between gap-4">
                            <div class="flex items-start gap-3 flex-1 min-w-0">
                                <input type="checkbox" class="eink-checkbox complete-todo-btn" title="Complete & Remove">
                                <span class="font-serif text-lg leading-snug text-ink break-words">
                                    ${escapeHTML(todo.text)}
                                </span>
                            </div>
                            <button 
                                type="button" 
                                class="delete-todo-btn font-mono text-xs uppercase tracking-[0.1em] text-charcoal hover:text-ink underline cursor-pointer shrink-0 pt-1"
                            >
                                Delete
                            </button>
                        </div>
                        ${subtasksHTML}
                    `;

                    todoList.appendChild(li);
                });
            }

            // Add Main Task
            todoForm.addEventListener('submit', (e) => {
                e.preventDefault();
                const text = todoInput.value.trim();
                if (!text) return;

                todos.unshift({
                    id: Date.now().toString(),
                    text,
                    completed: false,
                    subtasks: []
                });

                todoInput.value = '';
                saveTodos();
                renderTodos();
            });

            // Handle Sub-task additions
            todoList.addEventListener('submit', (e) => {
                if (e.target.classList.contains('subtask-form')) {
                    e.preventDefault();
                    const li = e.target.closest('li[data-id]');
                    const input = e.target.querySelector('.subtask-input');
                    const subText = input.value.trim();
                    if (!li || !subText) return;

                    const todo = todos.find(t => t.id === li.dataset.id);
                    if (todo) {
                        if (!todo.subtasks) todo.subtasks = [];
                        todo.subtasks.push({
                            id: `${todo.id}-${Date.now()}`,
                            text: subText,
                            completed: false
                        });
                        saveTodos();
                        renderTodos();
                    }
                }
            });

            // Handle Delete Task, Complete Task, or Remove Sub-task
            todoList.addEventListener('click', (e) => {
                const li = e.target.closest('li[data-id]');
                if (!li) return;
                const todoId = li.dataset.id;

                if (e.target.classList.contains('delete-todo-btn') || e.target.classList.contains('complete-todo-btn')) {
                    todos = todos.filter(t => t.id !== todoId);
                    saveTodos();
                    renderTodos();
                } else if (e.target.classList.contains('remove-sub-btn')) {
                    const subLi = e.target.closest('li[data-sub-id]');
                    const subId = subLi.dataset.subId;
                    const todo = todos.find(t => t.id === todoId);
                    if (todo && todo.subtasks) {
                        todo.subtasks = todo.subtasks.filter(s => s.id !== subId);
                        saveTodos();
                        renderTodos();
                    }
                }
            });

            // Clear Entire Sheet
            clearAllBtn.addEventListener('click', () => {
                if (todos.length > 0 && confirm('Clear all tasks from the sheet?')) {
                    todos = [];
                    saveTodos();
                    renderTodos();
                }
            });

            loadTodos();
            renderTodos();
        });
    </script>
</body>
</html>
